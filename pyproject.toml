[project]
name = "specialist"
version = "0.1.0"
description = "Multi-camera AprilTag SLAM for human data collection"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "gtsam>=4.3a0",
  "numpy>=1.26",
  "scipy>=1.11",
  "rerun-sdk>=0.21",
  "tyro>=0.9",
  "telemetry-parser>=0.3",
  "opencv-python>=4.10",
  "pupil-apriltags>=1.0.4",
  "allantools>=2024.6",
  "specialist-description",
  # Wheel-bundled static ffmpeg: audio sync needs no system install.
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.15.0",
  "mypy>=1.13",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
specialist-description = { git = "ssh://git@github.com/specialist-ai/specialist_description.git", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["src/specialist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
strict = true
files = ["src/specialist"]

[[tool.mypy.overrides]]
module = [
  "gtsam", "gtsam.*",
  "rerun", "rerun.*",
  "scipy", "scipy.*",
  "telemetry_parser", "telemetry_parser.*",
  "pupil_apriltags", "pupil_apriltags.*",
  "allantools", "allantools.*",
  "imageio_ffmpeg", "imageio_ffmpeg.*",
]
ignore_missing_imports = true
