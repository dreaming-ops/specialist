[project]
name = "specialist"
version = "0.1.0"
description = "Multi-camera AprilTag SLAM for human data collection"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  # The only cp312 wheels; the native MEI factor links this wheel's libgtsam.
  "gtsam==4.3a0",
  "numpy>=1.26",
  "pyarrow>=18",
  "scipy>=1.11",
  # The [datafusion] extra is the catalog client's query engine.
  "rerun-sdk[datafusion]>=0.36,<0.37",
  "tyro>=0.9",
  "telemetry-parser>=0.3",
  "opencv-python>=4.10",
  "pupil-apriltags>=1.0.4",
  "allantools>=2024.6",
  "specialist-description",
  # Wheel-bundled static ffmpeg: conversion needs no system install.
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# CUDA backends: the Schur LM solver (`solver.gpu`) and the DIS optical-flow
# frontend (`frontend.gpu_flow`). The cv2 flow covers a missing flow backend; a
# missing solver backend fails the run under the default `require` mode. The
# markers keep the extra empty where
# no CUDA wheels exist, so `uv sync --extra gpu` is a no-op there rather than a
# resolution failure.
gpu = [
  # The [ctk] and [cu12] extras carry the CUDA 12 runtime these wheels load at import.
  "cupy-cuda12x[ctk]>=14.1; sys_platform == 'linux'",
  "nvmath-python[cu12]>=1.0; sys_platform == 'linux'",
  "nvidia-cudss-cu12>=0.8; sys_platform == 'linux'",
  "torch>=2.11; sys_platform == 'linux'",
  # The vendored DIS kernels call triton directly.
  "triton>=3.4; sys_platform == 'linux'",
]
dev = [
  "pytest>=8.0",
  "ruff==0.15.0",
  "mypy>=1.13",
  "pre-commit>=3.8",
  # 2.x matches the gtsam wheel's pybind11 ABI; `uv run build-mei-factor` rebuilds.
  "pybind11==2.13.6",
]

[build-system]
requires = ["hatchling", "gtsam==4.3a0", "pybind11==2.13.6", "numpy>=1.26"]
build-backend = "hatchling.build"

[project.scripts]
build-mei-factor = "specialist.vi_ba._buildext:main"

[tool.uv.sources]
specialist-description = { git = "ssh://git@github.com/specialist-ai/specialist_description.git", branch = "main" }
# CUDA 12.9 builds: Blackwell (sm_120) kernels on the CUDA 12 toolkit cuDSS pins.
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
triton = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist"]
# The C++ source ships; the compiled extension (gitignored) is force-included.
artifacts = ["src/specialist/vi_ba/_mei_factor_cpp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
indent-width = 2

[tool.ruff.format]
# Vendored DIS optical-flow kernels, kept in their upstream style.
exclude = ["src/specialist/vi_ba/gpu_dis/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/specialist/vi_ba/gpu_dis/*" = ["E702", "E741", "I001", "B905"]

[tool.mypy]
strict = true
files = [
  "src/specialist",
  "scripts",
]
mypy_path = ["src"]
explicit_package_bases = true
# The vendored DIS kernels are untyped research code.
exclude = ["src/specialist/vi_ba/gpu_dis/"]

[[tool.mypy.overrides]]
module = [
  "gtsam", "gtsam.*",
  "cupy", "cupy.*", "cupyx", "cupyx.*",
  "nvmath", "nvmath.*",
  "specialist.vi_ba._mei_factor_cpp",
  "rerun", "rerun.*",
  "pyarrow", "pyarrow.*",
  "scipy", "scipy.*",
  "telemetry_parser", "telemetry_parser.*",
  "pupil_apriltags", "pupil_apriltags.*",
  "allantools", "allantools.*",
  "imageio_ffmpeg", "imageio_ffmpeg.*",
  "torch", "torch.*", "triton", "triton.*",
  "specialist_description", "specialist_description.*",
]
ignore_missing_imports = true

# `exclude` only stops directory discovery; mypy still follows the import.
[[tool.mypy.overrides]]
module = ["specialist.vi_ba.gpu_dis.*"]
follow_imports = "skip"
