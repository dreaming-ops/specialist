[project]
name = "specialist"
version = "0.1.0"
description = "Multi-camera AprilTag SLAM for human data collection"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  # The only cp312 wheels; the native MEI factor links this wheel's libgtsam.
  "gtsam==4.3a0",
  "numpy>=1.26",
  "scipy>=1.11",
  "rerun-sdk>=0.21",
  "tyro>=0.9",
  "telemetry-parser>=0.3",
  "opencv-python>=4.10",
  "pupil-apriltags>=1.0.4",
  "allantools>=2024.6",
  "specialist-description",
  # Wheel-bundled static ffmpeg: audio sync needs no system install.
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# CUDA backend for the Schur LM solver (`solver.gpu`); the tracker falls back
# to the gtsam optimizer when these are absent. The markers keep the extra empty
# where no CUDA wheels exist, so `uv sync --extra gpu` is a no-op there rather
# than a resolution failure.
gpu = [
  # The [ctk] and [cu12] extras carry the CUDA 12 runtime these wheels load at import.
  "cupy-cuda12x[ctk]>=14.1; sys_platform == 'linux'",
  "nvmath-python[cu12]>=1.0; sys_platform == 'linux'",
  "nvidia-cudss-cu12>=0.8; sys_platform == 'linux'",
]
dev = [
  "pytest>=8.0",
  "ruff==0.15.0",
  "mypy>=1.13",
  "pre-commit>=3.8",
  # 2.x matches the gtsam wheel's pybind11 ABI; `uv run build-mei-factor` rebuilds.
  "pybind11==2.13.6",
]

[build-system]
requires = ["hatchling", "gtsam==4.3a0", "pybind11==2.13.6", "numpy>=1.26"]
build-backend = "hatchling.build"

[project.scripts]
build-mei-factor = "specialist.vi_ba._buildext:main"

[tool.uv.sources]
specialist-description = { git = "ssh://git@github.com/specialist-ai/specialist_description.git", branch = "main" }

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist"]
# The C++ source ships; the compiled extension (gitignored) is force-included.
artifacts = ["src/specialist/vi_ba/_mei_factor_cpp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
strict = true
files = ["src/specialist"]

[[tool.mypy.overrides]]
module = [
  "gtsam", "gtsam.*",
  "cupy", "cupy.*", "cupyx", "cupyx.*",
  "nvmath", "nvmath.*",
  "specialist.vi_ba._mei_factor_cpp",
  "rerun", "rerun.*",
  "scipy", "scipy.*",
  "telemetry_parser", "telemetry_parser.*",
  "pupil_apriltags", "pupil_apriltags.*",
  "allantools", "allantools.*",
  "imageio_ffmpeg", "imageio_ffmpeg.*",
]
ignore_missing_imports = true
