[project]
name = "specialist-button"
version = "0.1.0"
description = "Acoustic marker frames for talking buttons: generator, decoder, and button programmer"
requires-python = ">=3.14,<3.15"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "tyro>=0.9",
  # Imported only by the programming and playback passes, which need PortAudio.
  "sounddevice>=0.5",
]

[project.scripts]
button = "specialist_button.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_button"]
