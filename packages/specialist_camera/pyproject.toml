[project]
name = "specialist-camera"
version = "0.1.0"
description = "The MEI fisheye lens: projection both ways, rescaling, and the lens as the policy sees it"
requires-python = ">=3.14,<3.15"
license = {text = "MIT"}
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialist_camera"]
