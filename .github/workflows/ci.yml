name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

env:
  UV_FROZEN: "1"

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run ruff check
        run: uvx ruff@0.15.0 check
      - name: Run ruff format
        run: uvx ruff@0.15.0 format --diff

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --no-group gpu --no-install-project --no-install-package specialist-description
      - name: Run mypy
        run: uv run --no-sync mypy

  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ matrix.os }}
      - name: Install Boost headers (the native MEI factor build needs them)
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Install dependencies
        run: uv sync --no-group gpu --no-install-package specialist-description
      - name: Run tests
        run: uv run --no-sync pytest
